name: Build KK Expenses APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore private signing keystore
        env:
          KK_KEYSTORE_BASE64: ${{ secrets.KK_KEYSTORE_BASE64 }}
          KK_KEYSTORE_PASSWORD: ${{ secrets.KK_KEYSTORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.KK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KK_KEYSTORE_BASE64"
          test -n "$KK_KEYSTORE_PASSWORD"
          test -n "$KK_KEY_ALIAS"
          umask 077
          printf '%s' "$KK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kk-expenses.jks"
          test -s "$RUNNER_TEMP/kk-expenses.jks"


      - name: Validate permanent signing key
        shell: bash
        env:
          KK_STORE_PASSWORD: ${{ secrets.KK_KEYSTORE_PASSWORD }}
          KK_ALIAS: ${{ secrets.KK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test "$(wc -c < "$RUNNER_TEMP/kk-expenses.jks")" -eq 3600
          keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/kk-expenses.jks" \
            -storepass "$KK_STORE_PASSWORD" \
            -alias "$KK_ALIAS" > /dev/null
          echo "Permanent signing keystore validated"
          
      - name: Run monthly financial regression tests
        run: |
          chmod +x gradlew
          ./gradlew :myExpenses:testExternDebugUnitTest \
            --tests "org.totschnig.myexpenses.compose.main.MonthlyActivityCalculationsTest" \
            --tests "org.totschnig.myexpenses.model.AccountLimitPolicyTest" \
            --no-daemon \
            --stacktrace

      - name: Build signed debug APK
        env:
          KK_SIGNING_STORE_FILE: ${{ runner.temp }}/kk-expenses.jks
          KK_SIGNING_STORE_PASSWORD: ${{ secrets.KK_KEYSTORE_PASSWORD }}
          KK_SIGNING_KEY_ALIAS: ${{ secrets.KK_KEY_ALIAS }}
          KK_SIGNING_KEY_PASSWORD: ${{ secrets.KK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :myExpenses:assembleExternDebug --no-daemon --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find myExpenses/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          SDK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$SDK_SIGNER"
          "$SDK_SIGNER" verify --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KK-Expenses-Signed-Debug-APK
          path: myExpenses/build/outputs/apk/**/*.apk
          if-no-files-found: error
